name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💾 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠 Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: ⚡ Configure Build for arm64-v8a Only
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties 2>/dev/null || true
          grep -q 'newArchEnabled' android/gradle.properties || echo 'newArchEnabled=false' >> android/gradle.properties

          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties 2>/dev/null || true
          grep -q 'reactNativeArchitectures' android/gradle.properties || echo 'reactNativeArchitectures=arm64-v8a' >> android/gradle.properties

          # Set EXPO_UPDATES_CHANNEL in AndroidManifest.xml
          UPDATE_CHANNEL="production"
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            UPDATE_CHANNEL="beta"
          fi
          echo "Setting EXPO_UPDATES_CHANNEL to $UPDATE_CHANNEL"
          sed -i "s|</application>|    <meta-data android:name=\"expo.modules.updates.EXPO_UPDATES_CHANNEL\" android:value=\"$UPDATE_CHANNEL\"/>\n  </application>|" android/app/src/main/AndroidManifest.xml

      - name: 🏗 Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease

          # Find and copy generated APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../Rungorize.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rungorize-arm64-v8a.apk
          path: Rungorize.apk
          retention-days: 30

      - name: 🏷 Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'beta' && format('v1.0.{0}-beta', github.run_number) || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_name == 'beta' && format('Rungorize Beta v1.0.{0}', github.run_number) || format('Rungorize v1.0.{0}', github.run_number) }}
          body: |
            ### 📱 Rungorize Android Release (arm64-v8a)
            - **Mimari:** arm64-v8a
            - **Derleme Numarası:** #${{ github.run_number }}
            - **OTA Güncelleme Kanalı:** ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
          files: Rungorize.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
